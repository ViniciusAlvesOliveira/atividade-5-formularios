
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9e9e9;
            margin: 0;
            padding: 20px;
        }

        .formulario {
            background-color: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 4px #4285f4;
        }

        .opcoes {
            margin-top: 10px;
        }

        .opcoes label {
            display: inline-block;
            margin-right: 15px;
        }

        .opcoes input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #4285f4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2865c7;
        }

        button[type="reset"] {
            background-color: #777;
        }

        button[type="reset"]:hover {
            background-color: #555;
        }

        @media (max-width: 600px) {
            .formulario {
                width: auto;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <div class="formulario">

        <h1>Cadastro</h1>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">

            <label for="curso">Curso:</label>
            <select id="curso" name="curso">
                <option value="">Selecione seu curso</option>
                <option>Engenharia de Software</option>
                <option>Administração</option>
                <option>Direito</option>
                <option>Psicologia</option>
                <option>Outro</option>
            </select>

            <label>Sexo:</label>
            <div class="opcoes">
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                <label><input type="radio" name="sexo" value="outro"> Outro</label>
            </div>

            <label>Interesses:</label>
            <div class="opcoes">
                <label><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label>
                <label><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
                <label><input type="checkbox" name="interesses" value="musica"> Música</label>
            </div>

            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>

            <label for="foto">Enviar foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*">

            <button type="submit">Enviar cadastro</button>
            <button type="reset">Limpar formulário</button>

        </form>

    </div>

</body>
</html>
